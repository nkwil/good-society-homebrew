<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">
  <!-- Three silhouetted figures — the cast on stage. Side figures are
       smaller and set behind the centered foreground figure to read as
       a group. Black-fill vector to match the other cabinet icons. -->
  <!-- Left figure -->
  <circle cx="22" cy="42" r="12" fill="#000000"/>
  <path d="M 6 94 Q 6 62, 22 62 Q 38 62, 38 94 Z" fill="#000000"/>
  <!-- Right figure -->
  <circle cx="90" cy="42" r="12" fill="#000000"/>
  <path d="M 74 94 Q 74 62, 90 62 Q 106 62, 106 94 Z" fill="#000000"/>
  <!-- Center figure (foreground, larger) -->
  <circle cx="56" cy="38" r="16" fill="#000000"/>
  <path d="M 32 100 Q 32 60, 56 60 Q 80 60, 80 100 Z" fill="#000000"/>
</svg>
